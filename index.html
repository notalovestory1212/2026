<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>冇所謂啦 — 戀愛情緒模擬器</title>

<!-- 字體：Noto Sans HK（對白）+ Noto Serif HK（旁白） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&family=Noto+Serif+HK:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   第一部分：CSS（負責個樣）
   你想改色、改字體、改泡疹形狀，全部喺呢度。
   ============================================================ */

/* --- 設計代幣：一次過定義全站顏色/字級/間距 --- */
:root{
  /* 深夜香港配色 */
  --color-bg:#0e1116;            /* 頁面最底色（深夜） */
  --color-surface:#151a20;       /* 背景一層 */
  --color-bubble-l:#1e252d;      /* 對方（左）訊息泡 */
  --color-bubble-r:#1f5045;      /* 你（右）訊息泡 */
  --color-text:#eae8e1;          /* 主文字色 */
  --color-text-muted:#93a0ab;     /* 次要文字 */
  --color-nar:#b9c4cd;           /* 旁白色（霧藍） */
  --color-accent:#e6b968;        /* 強調色（晚霞金） */
  --color-divider:#2a323b;

  /* 字級（流動式，手機桌面都啱用）
     注意：clamp() 入面嘅 + 號前後必須有空格，唔係成句會失效！ */
  --text-xs:clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm:clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base:clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg:clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl:clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);

  /* 間距（4px系統） */
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-12:3rem;

  --radius-md:0.5rem;
  --radius-lg:0.75rem;
  --radius-bubble:1.1rem;

  --font-body:'Noto Sans HK','PingFang HK','Microsoft JhengHei',sans-serif;
  --font-nar:'Noto Serif HK','PingFang HK',serif;
}

/* --- 基礎 reset --- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:none;-webkit-font-smoothing:antialiased}
body{
  min-height:100dvh;
  font-family:var(--font-body);
  font-size:var(--text-base);
  color:var(--color-text);
  background:
    radial-gradient(1200px 600px at 50% -10%, #1a2230 0%, transparent 60%),
    var(--color-bg);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* --- 手機框：手機直上一個chat app嘅感覺，桌面就中間一個「電話」 --- */
#app{
  max-width:430px;margin:0 auto;
  height:100dvh;               /* 固定高度：令對話區自己scroll，唔係成個頁面長 */
  display:flex;flex-direction:column;
  background:var(--color-surface);
}
@media (min-width:520px){
  #app{
    height:92dvh;margin:4dvh auto;border-radius:var(--radius-lg);
    overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);
    border:1px solid var(--color-divider);
  }
}

/* --- 頂部 bar --- */
#chat-header{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);
  background:rgba(14,17,22,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--color-divider);
  position:sticky;top:0;z-index:5;
}
#avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#2a3f55,#1f5045);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--color-accent);font-size:var(--text-sm);
}
#who{display:flex;flex-direction:column;line-height:1.3}
#who .name{font-weight:500;font-size:var(--text-sm)}
#who .status{font-size:var(--text-xs);color:var(--color-text-muted)}

/* --- 對話區 --- */
#stage{
  flex:1;min-height:0;   /* min-height:0 係關鍵：俾 flex 子元素真正縮細 + 內部scroll */
  overflow-y:auto;padding:var(--space-4) var(--space-3) var(--space-8);
  display:flex;flex-direction:column;gap:var(--space-3);
  scroll-behavior:smooth;
}

/* 旁白（襯線體、置中、霧藍色） */
.nar{
  font-family:var(--font-nar);
  color:var(--color-nar);
  text-align:center;
  max-width:34ch;margin-inline:auto;
  font-size:var(--text-base);
  line-height:1.9;
  animation:fadeIn .5s ease both;
}
.nar.big{font-size:var(--text-lg);color:var(--color-text);font-weight:600}
.nar.feel{color:var(--color-accent);font-size:var(--text-sm)}

/* 【系統】提示框 */
.sysprompt{
  align-self:center;text-align:center;
  font-size:var(--text-xs);color:var(--color-accent);
  border:1px solid color-mix(in oklab,var(--color-accent) 35%,transparent);
  border-radius:999px;padding:var(--space-1) var(--space-4);
  animation:fadeIn .4s ease both;
}

/* 訊息泡 */
.msg{display:flex;flex-direction:column;max-width:78%;animation:popIn .35s ease both}
.msg.L{align-self:flex-start}
.msg.R{align-self:flex-end;align-items:flex-end}
.msg .name{font-size:var(--text-xs);color:var(--color-text-muted);margin:0 var(--space-2) var(--space-1)}
.msg .bubble{
  padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-bubble);
  font-size:var(--text-base);line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
}
.msg.L .bubble{background:var(--color-bubble-l);border-bottom-left-radius:4px}
.msg.R .bubble{background:var(--color-bubble-r);border-bottom-right-radius:4px}
.msg .meta{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:var(--space-1);padding:0 var(--space-1)}

/* 「輸入中…」動畫（真嘅 <span>，唔係 div） */
.typing{display:flex;gap:5px;padding:var(--space-3) var(--space-4)}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--color-text-muted);animation:blink 1.2s infinite;display:inline-block}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

/* 天氣小徽章 */
.chip{
  align-self:center;display:flex;align-items:center;gap:var(--space-2);
  font-size:var(--text-xs);color:var(--color-text-muted);
  background:rgba(255,255,255,.04);border:1px solid var(--color-divider);
  padding:var(--space-1) var(--space-3);border-radius:999px;
  animation:fadeIn .5s ease both;
}

/* --- 選項按鈕區 --- */
#choicebox{padding:var(--space-3) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--space-2)}
#choicebox:empty{padding:0}
.opt{
  text-align:left;
  padding:var(--space-3) var(--space-4);
  background:var(--color-surface);
  border:1px solid var(--color-divider);
  border-radius:var(--radius-md);
  font-size:var(--text-sm);line-height:1.6;
  transition:border-color .18s ease,transform .18s ease,background .18s ease;
  animation:fadeIn .35s ease both;
}
.opt:hover{border-color:var(--color-accent);background:rgba(230,185,104,.06)}
.opt:active{transform:scale(.985)}

/* --- 開場畫面 --- */
#title{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--space-6);text-align:center;
  background:
    radial-gradient(800px 500px at 50% 20%, #1c2735 0%, transparent 65%),
    var(--color-bg);
  padding:var(--space-8);
  animation:fadeIn .8s ease both;
}
#title h1{
  font-family:var(--font-nar);font-weight:600;
  font-size:clamp(2.2rem,10vw,3.4rem);
  letter-spacing:.08em;color:var(--color-text);
}
#title .sub{color:var(--color-nar);font-size:var(--text-sm);letter-spacing:.2em}
#title .credit{color:var(--color-text-muted);font-size:var(--text-xs);max-width:30ch;line-height:1.8}
#start-btn{
  padding:var(--space-3) var(--space-10);
  border:1px solid var(--color-accent);color:var(--color-accent);
  border-radius:999px;font-size:var(--text-sm);letter-spacing:.3em;
  transition:background .18s ease,color .18s ease;
}
#start-btn:hover{background:var(--color-accent);color:#141009}
#title .hint{color:var(--color-text-muted);font-size:var(--text-xs)}
#title .expo-tag{
  color:var(--color-accent);font-size:var(--text-xs);letter-spacing:.15em;
  border:1px solid color-mix(in oklab,var(--color-accent) 35%,transparent);
  border-radius:999px;padding:var(--space-1) var(--space-4);
}

/* 展覽連結：開場同報告頁共用，跟隨角色主題色 */
.expo-link{
  display:inline-block;align-self:center;
  color:var(--color-accent);font-size:var(--text-xs);letter-spacing:.15em;
  border:1px solid color-mix(in oklab,var(--color-accent) 35%,transparent);
  border-radius:999px;padding:var(--space-1) var(--space-4);
  text-decoration:none;
  transition:background .18s ease;
}
.expo-link:hover{background:color-mix(in oklab,var(--color-accent) 10%,transparent)}

/* --- 天氣報告畫面 --- */
#report{
  position:fixed;inset:0;z-index:20;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  gap:var(--space-6);text-align:center;padding:var(--space-8) var(--space-6);
  background:
    radial-gradient(700px 500px at 50% 0%, #22303f 0%, transparent 70%),
    var(--color-bg);
  animation:fadeIn .8s ease both;
}
/* 用 margin:auto 做置中：內容細過螢幕時置中，大過螢幕時正常咁scroll（唔會裁頂） */
#report::before,#report::after{content:'';margin-block:auto;flex:0 0 0;}
#report h2{font-family:var(--font-nar);font-size:var(--text-lg);color:var(--color-text);font-weight:600}
#report .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--space-3);max-width:340px}
.wcard{
  display:flex;flex-direction:column;align-items:center;gap:var(--space-1);
  border:1px solid var(--color-divider);border-radius:var(--radius-md);
  padding:var(--space-4) var(--space-6);min-width:130px;
  background:rgba(255,255,255,.03);
}
.wcard .icon{font-size:1.8rem}
.wcard .n{font-family:var(--font-nar);font-size:var(--text-xl);color:var(--color-text)}
.wcard .lab{font-size:var(--text-xs);color:var(--color-text-muted)}
#report .summary{font-family:var(--font-nar);color:var(--color-nar);font-size:var(--text-base);max-width:30ch;line-height:2}
#report .summary .lyric{color:var(--color-accent)}
#report .summary .song{color:var(--color-text-muted);font-size:var(--text-sm);margin-left:var(--space-2);white-space:nowrap}
#report .expo{
  border-top:1px solid var(--color-divider);padding-top:var(--space-4);
  color:var(--color-nar);font-size:var(--text-sm);line-height:2;max-width:32ch;
}
#report .fine{font-size:var(--text-xs);color:var(--color-text-muted);max-width:34ch;line-height:1.8}
#report .row{display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:center}
#report button{
  padding:var(--space-2) var(--space-6);border-radius:999px;
  border:1px solid var(--color-divider);color:var(--color-text-muted);font-size:var(--text-sm);
  transition:color .18s ease,border-color .18s ease;
}
#report button:hover{color:var(--color-accent);border-color:var(--color-accent)}

/* --- Kay 主題（隨機角色：灰藍+白） --- */
body.kay{
  --color-bg:#0f151d;
  --color-surface:#151d28;
  --color-bubble-l:#1e2937;
  --color-bubble-r:#2f4d6b;
  --color-text:#eef2f7;
  --color-text-muted:#9fb0c0;
  --color-nar:#c5d2e0;
  --color-accent:#9cc4e4;
  --color-divider:#2a3646;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1b2a3e 0%, transparent 60%),
    var(--color-bg);
}
body.kay #chat-header{background:rgba(15,21,29,.85)}
body.kay #avatar{background:linear-gradient(135deg,#33465e,#2f4d6b)}
body.kay .opt:hover{border-color:var(--color-accent);background:rgba(156,196,228,.08)}
body.kay #report{
  background:
    radial-gradient(700px 500px at 50% 0%, #22334a 0%, transparent 70%),
    var(--color-bg);
}
/* Kay 嘅角色總結句：放喺歌詞前 */
#report .summary .kayline{display:block;color:var(--color-nar);margin-bottom:var(--space-2)}


/* Carlos：桃紅 × 黑色，僅在抽中 Carlos 時套用 */
body.carlos{
  --color-bg:#080509;--color-surface:#100a11;
  --color-bubble-l:#381126;--color-bubble-r:#b91e70;
  --color-text:#fff1f8;--color-text-muted:#c89cb4;
  --color-nar:#efb3d1;--color-accent:#ff4da6;
  --color-divider:#4b2039;
  background:radial-gradient(900px 600px at 50% -15%,#4c1232 0%,transparent 65%),#080509;
}
body.carlos #chat-header{background:rgba(13,5,12,.92)}
body.carlos #avatar{background:linear-gradient(135deg,#ff65b8,#7b1048);color:#fff}
body.carlos .opt:hover{border-color:#ff4da6;background:rgba(255,77,166,.12)}
body.carlos #report{background:radial-gradient(700px 500px at 50% 0%,#3a0e29 0%,transparent 70%),#080509}

/* --- 動畫 keyframes --- */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style>
</head>

<!-- ============================================================
     第二部分：HTML（頁面骨幹）
     得三個主要元素：頂bar、對話區、選項區。
     之後所有嘢（對白、旁白、選項）都係由 JS 動態加落去。
     ============================================================ -->
<div id="app">

</div>

<script>
/* ============================================================
   第三部分：JavaScript（成個遊戲嘅引擎同劇本）

   想睇明個結構，記住三樣嘢：
   1. 狀態（state）—— 記低你嘅選擇同天氣
   2. 小工具（nar / msg / pick …）—— 負責顯示對白同收集選擇
   3. 角色資料（CHARS）+ 章節函數 —— 阿Chak / Kay / Carlos 三套劇本，

   ============================================================ */

  weather:{ sun:0, fog:0, storm:0, damp:0 }, // 晴/霧/雷/潮
  ch2_reply:null,   // 第2章你覆咗咩（第4章回調用）
  ch2_feel:null,    // 第2章你嘅感受（第4章回調用）
  ch2_send:null,    // 第2章你實際send咗嗰句（第4章原句重播）

  ending:null,
};

/* ---------- 2. 角色 ---------- */

    ],
    replies:[
      {t:'講真',v:1},
      {t:'「ok啦 😅」',v:2,send:'ok啦 😅'},

      {t:'（react一個emoji）',v:4,send:'😂'},

    b1:{
      pre:['（阿Chak 輸入中…… 停咗。再輸入中。）','一分鐘後，你手機響 —— 係佢打電話嚟。'],

    sys:'一個禮拜後 · 星期六 · 第二章',

let C = null; // 今次抽中嘅角色

/* ---------- 3. 小工具 ---------- */
const $  = s => document.querySelector(s);
const stage = $('#stage'), choicebox = $('#choicebox');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function scrollDown(){ stage.scrollTop = stage.scrollHeight; }
function el(cls){ const e=document.createElement('div'); e.className=cls; return e; }

/* 旁白（系統會自動等一陣，俾人睇完先） */
async function nar(text, cls=''){
  const d = el('nar '+cls); d.textContent = text;
  stage.append(d); scrollDown(); await sleep(600); return d;
}

/* 【系統】提示 */
async function sys(text){
  const d = el('sysprompt'); d.textContent = text;
  stage.append(d); scrollDown(); await sleep(500);
}

/* 對方「輸入中…」 */
async function typing(){
  const w = el('msg L');
  const t = el('typing');
  for(let i=0;i<3;i++){ const s=document.createElement('span'); t.append(s); }
  w.append(t); stage.append(w); scrollDown();
  await sleep(650 + Math.random()*550);
  w.remove();
}

/* 訊息泡：side='L'對方 / 'R'你；name可選（第4章用） */
async function msg(side, text, name=null){
  if(side==='L') await typing();
  else await sleep(250);
  const w = el('msg '+side);
  if(name){ const n=el('name'); n.textContent=name; w.append(n); }
  const b = el('bubble'); b.textContent = text; w.append(b);
  const m = el('meta'); m.textContent = timeNow(); w.append(m);
  stage.append(w); scrollDown(); await sleep(400);
}
function timeNow(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* 天氣徽章 + 記分 */
async function weather(kind){
  state.weather[kind]++;
  const label = {sun:'晴 +1',fog:'霧 +1',storm:'雷雨 +1',damp:'潮濕 +1'}[kind];
  const icon  = {sun:'☀️',fog:'🌫️',storm:'⛈️',damp:'💧'}[kind];
  const c = el('chip'); c.textContent = icon+' '+label;
  stage.append(c); scrollDown(); await sleep(700);
}

/* 選項：pick('問題',[{t:'按鈕字',v:'值',send:'真係send出去嘅字'}], {side:'L', name:'Kay（你）'})
   揀完會自動清空按鈕區，傳返個值俾你。
   side/name 係第4章用：扮佢嗰陣，你send嘅嘢要走左邊。 */
function pick(prompt, options, cfg={}){
  return new Promise(async resolve=>{
    if(prompt) await sys(prompt);
    for(const o of options){
      const b = document.createElement('button');
      b.className='opt'; b.textContent=o.t;
      b.onclick = async ()=>{
        choicebox.innerHTML='';
        if(o.send) await msg(cfg.side||'R', o.send, cfg.name||null);
        resolve(o.v);
      };
      choicebox.append(b);
    }
    scrollDown();
  });
}

/* 「繼續」掣：俾玩家自己控制閱讀節奏（章節之間用） */
function cont(label='繼續 →'){
  return new Promise(resolve=>{
    const b = document.createElement('button');
    b.className='opt cont'; b.textContent=label;
    b.onclick = ()=>{ b.remove(); resolve(); };
    choicebox.append(b); scrollDown();
  });
}

  $('#h-name').textContent = name;

}

    await msg('L', B.b4.reply);
    if(feel===4){
      for(const n of B.b4.ok) await nar(n);
      await weather('sun');
    }else{
      for(const n of B.b4.bad) await nar(n);
      await weather('fog');
    }
  }
}

async function ch2(){
  await sys(C.ch2.sys);
  for(const n of C.ch2.scene) await nar(n);
  await msg('L', C.ch2.opener);
  if(C.ch2.afterOpener){for(const n of C.ch2.afterOpener) await nar(n);}
  else {await nar('你望住個mon。');await nar('期待咗成個禮拜嘅嘢，原來可以一個訊息就冇咗。');}

  const feel = await pick('【呢一刻，你——】', C.ch2.feels);
  await nar('（你心入面：'+C.ch2.feelName[feel-1]+'）','feel');
  state.ch2_feel = feel; // 記低，第4章回調要用

  /* 「講真」嘅字會按你頭先嘅感受變 —— 咁先至真係「講出你自己嗰句」 */
  const truth2 = C.ch2.truth[feel-1];
  const opts = C.ch2.replies.map(o => ({...o, send: o.v===3 ? truth2 : o.send}));
  const reply = await pick('【你覆——】', opts);
  state.ch2_reply = reply;      // 記低，第4章要回調
  state.ch2_send = opts[reply-1].send; // 記低實際send咗嗰句，第4章原句重播

  /* —— 結果（按感受分支） —— */
  const B = C.ch2;
  if(reply===3){ /* 講出心入面嗰句 */
    if(B.b3.perFeel){ /* 阿Chak：按感受四個版本 */
      const b = B.b3.perFeel[feel-1];
      for(const n of b.pre) await nar(n);
      for(const m of b.msgs) await msg('L', m);
      for(const n of b.post) await nar(n);
    }else{ /* Kay：一句過 */
      for(const n of B.b3.pre) await nar(n);
      await msg('L', B.b3.msg);
      for(const n of B.b3.post) await nar(n);
    }
    await weather('sun');
  }
  else if(reply===1){ /* 「冇所謂啦」 */
    await msg('L', B.b1.msg);
    for(const n of B.b1.pre) await nar(n);
    if(C.key==='kay'){ /* Kay版：四個感受都係霧（照角色劇本） */
      await weather('fog');
    }
    else if(feel===2){
      for(const n of B.b1.f2) await nar(n);
      await weather('sun');
    }
    else if(feel===4){
      for(const n of B.b1.f4) await nar(n);
      await weather('damp');
    }
    else if(feel===3){
      for(const n of B.b1.f3) await nar(n);
      await weather('fog'); await weather('storm');
    }
    else{
      for(const n of B.b1.f1) await nar(n);
      await weather('fog');
    }
  }
  else if(reply===2){ /* 問發生咩事 */
    for(const n of B.b2.pre) await nar(n);
    await msg('L', B.b2.msg);
    for(const n of B.b2.post) await nar(n);
    if(feel===2){ if(B.b2.f2) for(const n of B.b2.f2) await nar(n); await weather('sun'); }
    else if(feel===4){ await weather('damp'); }
    else if(feel===3){ if(B.b2.f1) for(const n of B.b2.f1) await nar(n); await weather('fog'); await weather('storm'); }
    else{
      if(B.b2.f1) for(const n of B.b2.f1) await nar(n);
      await weather('fog');
    }
  }
  else{ /* 約第二次 */
    await msg('L', B.b4.msg);
    for(const n of B.b4.nars) await nar(n);
    if(feel===2){ await weather('sun'); }
    else if(feel===4){ await weather('damp'); }
    else if(feel===3){ await weather('fog'); await weather('storm'); }
    else{ await weather('fog'); }
  }
}

async function ch3(){
  await sys(C.ch3.sys);
  for(const n of C.ch3.scene) await nar(n);
  await msg('L', C.ch3.opener);

  const feel = await pick('【你望住呢句嘢——】', C.ch3.feels);
  await nar('（你心入面：'+C.ch3.feelName[feel-1]+'）','feel');

  /* 「講出你想要咩」同樣按感受變 —— 唔會叫你send一句唔係你心聲嘅嘢 */
  const want = C.ch3.want[feel-1];
  const opts = C.ch3.replies.map(o => ({...o, send: o.v===2 ? want : o.send}));
  const reply = await pick('【你覆——】', opts);

  const B = C.ch3;
  if(reply===1){
    await msg('L', B.b1.msg);
    if(feel===2){
      for(const n of B.b1.ok) await nar(n);
      await weather('sun');
    }else{
      for(const n of B.b1.bad) await nar(n);
      await weather('fog');
    }
  }
  else if(reply===2){
    await nar(B.b2.pre);
    if(B.b2.perFeel){ /* 阿Chak：按感受四個版本 */
      const b = B.b2.perFeel[feel-1];
      for(const m of b.msgs) await msg('L', m);
      for(const n of b.post) await nar(n);
    }else{ /* Kay：一句過 */
      await msg('L', B.b2.msg);
      for(const n of B.b2.post) await nar(n);
    }
    await weather('sun');
  }
  else if(reply===3){
    await msg('L', B.b3.msg);
    for(const n of B.b3.nars) await nar(n);
    await weather('damp');
  }
  else{
    await msg('L', B.b4.msg);
    if(B.b4.pre) await nar(B.b4.pre);
    if(feel===4){
      for(const n of B.b4.ok) await nar(n);
      await weather('sun');
    }else{
      for(const n of B.b4.bad) await nar(n);
      await weather('fog');
    }
  }
}

async function ch4(){
  await sys('視角反轉 · 第四章');
  setHeader(C.name+'（你）', '而家，你係'+C.name);
  await nar('而家，掉返轉。','big');
  for(const n of C.ch4.intro) await nar(n);
  await sleep(400);
  for(const n of C.ch4.truth) await nar(n);
  await sleep(400);

  await nar('然後，佢覆咗——');
  /* —— 回調：重播玩家第2章嘅實際send字（原句） —— */
  const r = state.ch2_reply;
  const f = state.ch2_feel;
  await msg('R', state.ch2_send, '佢');
  const RP = C.ch4.replay;
  if(r===1){ for(const n of RP.r1) await nar(n); }
  else if(r===2){ for(const n of RP.r2) await nar(n); }
  else if(r===3){
    if(RP.r3) for(const n of RP.r3[f-1]) await nar(n); /* 阿Chak：按感受嘅內心戲 */
  }
  else{ for(const n of RP.r4) await nar(n); }
  await sleep(400);

  await sys(C.ch4.backSys);
  for(const n of C.ch4.tonight) await nar(n);

  /* 扮佢：你send嘅嘢走左邊（L），姓名標示「XX（你）」 */
  const reply = await pick('【你——】', C.ch4.choices, {side:'L', name:C.name+'（你）'});
  state.ch4_reply = reply;

  if(reply===1){
    for(const n of C.ch4.d1) await nar(n);
  }else if(reply===2){
    for(const n of C.ch4.d2.pre) await nar(n);
    await msg('R', C.ch4.d2.msg, '佢');
    for(const n of C.ch4.d2.post) await nar(n);
  }else{
    for(const n of C.ch4.d3.pre) await nar(n);
    await msg('R', C.ch4.d3.msg, '佢');
    for(const n of C.ch4.d3.post) await nar(n);
  }
}

async function ch5(){
  await sys(C.ch5.sys);
  setHeader(C.name, C.status);
  for(const n of C.ch5.scene) await nar(n);
  for(const line of (C.ch5.opening || ['我唔係想問你「我哋算咩」。','我想知 —— 你想要啲咩？'])) await msg('L',line);
  await nar('你講出口嗰句，就係你嘅答案。');
  await nar(C.ch5.choices.length===3?'（三個結局，冇高低分。）':'（四個結局，冇高低分。）','feel');
  if(C.ch5.reminder) await nar(C.ch5.reminder,'feel');

  const ending = await pick('【你話——】', C.ch5.choices);
  state.ending = ending;
  await sleep(600);

  /* —— 統一結局格式：對方回覆（如有）→ 旁白 —— */
  const E = C.ch5.endings[ending];
  if(E.msgs){
    await nar('（輸入中……）');
    for(const m of E.msgs) await msg('L', m);
    if(C.ch5.aCond && ending==='A' && state.ch4_reply===1){
      await nar(C.ch5.aCond);
    }
  }
  for(const n of E.nars) await nar(n);
}

/* ---------- 5. 天氣報告 ----------
   v1.3：總結句加廣東歌歌詞；Kay版另有一句角色總結放喺歌詞前。
   注意：一次遊戲入面每種天氣最多記3次，所以「霧」嘅門檻係 ≥3（劇本寫嘅 ≥4 其實行唔到） */
function summaryParts(){
  const w = state.weather;
  if(w.storm>=2) return {kind:'storm',q:'過盡千帆皆不是', s:'《Sabrina之淚》', l:'一直收埋嘅情緒，無論對你，抑或對方，都係不吐，不快。'};
  if(w.fog>=3)   return {kind:'fog',  q:'浮浮沉浮浮沉沉', s:'《當兵的自我修養》', l:'你嘅天氣報告入面，霧多過晴。唔緊要 —— 霧，始終會散。'};
  if(w.sun>=3)   return {kind:'sun',  q:'真心經過試驗才知真的不會變', s:'《重回那天那地》', l:'放低心中防線，先會坦然講出可能會傷害對方嘅真話。'};
  if(w.damp>=3)  return {kind:'damp', q:'原來戀愛統統統統寫得太多，令我澄明而愛的很少', s:'《寫得太多》', l:'唔sure都係一種答案。唔係所有感覺都要即刻有結論。'};
  return {kind:'default', q:'無論陰晴，愛永遠存在。', s:'', l:'無需擔心佢會消失，無需懷疑自己，因為佢紮根於本能。'};
}

async function showReport(){
  await cont('睇你嘅情緒天氣報告 →');
  await sleep(300);
  const w = state.weather;
  const p = summaryParts();
  const extra = (C.reportExtra && C.reportExtra[p.kind]) || null; /* Kay：歌詞前嗰句 */
  const rep = document.createElement('div');
  rep.id='report';
  rep.innerHTML = `
    <h2>你嘅戀愛情緒天氣報告</h2>
    <div class="grid">
      <div class="wcard"><span class="icon">☀️</span><span class="n">${w.sun}</span><span class="lab">晴 · 講真話</span></div>
      <div class="wcard"><span class="icon">🌫️</span><span class="n">${w.fog}</span><span class="lab">霧 · 收埋</span></div>
      <div class="wcard"><span class="icon">⛈️</span><span class="n">${w.storm}</span><span class="lab">雷雨 · 嬲但冇出口</span></div>
      <div class="wcard"><span class="icon">💧</span><span class="n">${w.damp}</span><span class="lab">潮濕 · 唔sure</span></div>
    </div>
    <p class="summary">${extra?'<span class="kayline">'+extra+'</span>':''}<span class="lyric">${p.q}</span>${p.s ? '<span class="song">——' + p.s + '</span>' : ''}<br>${p.l}</p>
    <p class="fine">呢個係藝術體驗，唔係心理評估。<br>你嘅情緒，你自己先係專家。</p>
    <div class="expo">
      <p>而家，歡迎喺12-20.12.2026到訪香港逸東酒店。</p>
      <p>探索愛情同自我之間嘅關係。</p>
      <a class="expo-link" href="https://www.instagram.com/not_a.love.story/" target="_blank" rel="noopener noreferrer">了解展覽</a>
    </div>
    <div class="row">
      <button id="again-btn">再玩一次</button>
      <button id="copy-btn">複製總結</button>
    </div>`;
  document.body.append(rep);
  $('#again-btn').onclick = ()=>location.reload();
  $('#copy-btn').onclick = async ()=>{
    const p = summaryParts();
    const text = `【冇所謂啦】我嘅戀愛情緒天氣報告：晴×${w.sun} 霧×${w.fog} 雷×${w.storm} 潮×${w.damp} —— ${extra?extra+' ':''}${p.q}${p.s ? '（' + p.s + '）' : ''}${p.l}`;
    try{ await navigator.clipboard.writeText(text); $('#copy-btn').textContent='複製咗 ✓'; }
    catch{ $('#copy-btn').textContent='長按截圖分享啦'; }
  };
}

/* ---------- 6. 主流程：開波 ----------
   每章之間有「繼續」掣，節奏由玩家話事。
   角色隨機抽；用 #kay / #chak / #carlos 開波可以強制指定（測試/示範用）。 */
let started = false;
$('#start-btn').onclick = async ()=>{
  if(started) return; started = true; /* 防止撳兩下開咗兩局 */
  const hash = (location.hash||'').replace('#','').toLowerCase();
  C = CHARS[hash] || CHARS[Object.keys(CHARS)[Math.floor(Math.random()*Object.keys(CHARS).length)]];
  document.body.classList.toggle('kay', C.key==='kay'); /* Kay：灰藍+白主題 */
  document.body.classList.toggle('carlos', C.key==='carlos');
  $('#avatar').textContent = C.avatar;
  setHeader(C.name, C.status);
  $('#title').remove();
  await ch0_intro();
  await cont();
  await ch1();
  await cont();
  await ch2();
  await cont();
  await ch3();
  await cont();
  await ch4();
  await cont();
  await ch5();
  await showReport();
};

/* 開波前：如果 link 有 #kay / #chak / #carlos，標題畫面預先顯示嗰個角色 */
(()=>{
  const h=(location.hash||'').replace('#','').toLowerCase();
  const c=CHARS[h];
  if(c){
    document.body.classList.toggle('kay', c.key==='kay');
    document.body.classList.toggle('carlos', c.key==='carlos');
    $('#avatar').textContent=c.avatar;
    setHeader(c.name,c.status);
  }
})();
</script>
