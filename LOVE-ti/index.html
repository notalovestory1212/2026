<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE-ti 戀愛人格測試 | Love Personality Test</title>
<meta name="description" content="LOVE-ti 戀愛人格測試：3 個維度、8 種戀愛人格，測出你的專屬戀愛人格和歌詞。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#d41767;
  --pink-deep:#8e0b45;
  --pink-mid:#e94d8c;
  --pink-soft:#ffe4ef;
  --pink-pale:#fff3f8;
  --ink:#311423;
  --muted:#8c6a7b;
  --paper:#fffafd;
  --line:#f2bfd7;
  --mono:'DM Mono',ui-monospace,monospace;
  --pixel:'Press Start 2P',var(--mono);
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(212,23,103,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,23,103,.045) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,.25));
}
.scanlines{position:fixed;inset:0;z-index:90;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(212,23,103,.028) 3px 4px)}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono)}
.pixel{font-family:var(--pixel)}

/* ---------- top bar ---------- */
.topbar{border-bottom:2px solid var(--pink);background:rgba(255,250,253,.86);backdrop-filter:blur(8px);position:sticky;top:0;z-index:60}
.topbar-in{max-width:1080px;margin:auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--pink-deep);font-weight:500}
.brand .dot{width:9px;height:9px;background:var(--pink);border-radius:50%;box-shadow:0 0 0 4px rgba(212,23,103,.14);animation:blink 1.6s steps(2) infinite}
.barcode{height:22px;width:96px;background:repeating-linear-gradient(90deg,var(--pink) 0 2px,transparent 2px 4px,var(--pink) 4px 5px,transparent 5px 9px,var(--pink) 9px 12px,transparent 12px 14px);opacity:.8}
.top-right{display:flex;align-items:center;gap:14px}
.lang-switch{display:flex;border:1.5px solid var(--pink);background:#fff;box-shadow:2px 2px 0 var(--pink-soft)}
.lang-btn{border:0;background:transparent;color:var(--pink-deep);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:6px 9px;cursor:pointer;line-height:1;transition:background .16s,color .16s}
.lang-btn+button{border-left:1px solid var(--line)}
.lang-btn:hover{background:var(--pink-pale)}
.lang-btn.active{background:var(--pink);color:#fff;font-weight:500}
@keyframes blink{50%{opacity:.25}}

/* ---------- screens ---------- */
.screen{display:none;animation:fadeUp .55s cubic-bezier(.2,.8,.2,1)}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero-head{padding:56px 0 24px}
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:52px;align-items:start;padding:0 0 80px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--pink);border:1.5px solid var(--pink);padding:7px 11px;background:#fff;box-shadow:3px 3px 0 var(--pink-soft)}
.title{margin:22px 0 4px;font-size:clamp(60px,8.6vw,104px);line-height:.92;font-weight:900;letter-spacing:-.06em;color:var(--pink-deep);text-shadow:5px 5px 0 #ffd3e5}
.title span{color:transparent;-webkit-text-stroke:2.5px var(--pink);text-shadow:none}
.subtitle{font-family:var(--mono);font-size:clamp(12px,1.5vw,15px);letter-spacing:.19em;color:var(--muted);margin:16px 0 30px;text-transform:uppercase}
.intro{position:relative;background:#fff;border:2px solid var(--pink);box-shadow:6px 6px 0 var(--pink-soft);padding:22px 24px 22px 30px;font-size:14.5px;line-height:2;color:#523349;max-width:500px}
.intro::before{content:"♥";position:absolute;left:-14px;top:-18px;background:var(--pink);color:#fff;width:30px;height:30px;display:grid;place-items:center;font-size:15px;box-shadow:3px 3px 0 var(--pink-soft)}
.intro b{color:var(--pink-deep)}
.intro p{margin:0 0 12px}
.intro p:last-child{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:2px solid var(--pink-deep);background:var(--pink);color:#fff;font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.06em;padding:15px 30px;box-shadow:6px 6px 0 var(--pink-deep);transition:transform .16s,box-shadow .16s,background .16s;user-select:none}
.btn:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--pink-deep);background:var(--pink-mid)}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--pink-deep)}
.btn.ghost{background:#fff;color:var(--pink-deep);box-shadow:4px 4px 0 var(--pink-soft)}
.btn.small{padding:11px 18px;font-size:13px;box-shadow:4px 4px 0 var(--pink-deep)}
.hero-actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:0}
.note{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7;max-width:250px}

/* ---------- exhibition ---------- */
.exhibit{position:relative;background:var(--pink-pale);border:1.5px solid var(--pink);border-left:5px solid var(--pink);padding:14px 18px 15px;max-width:500px;margin:22px 0}
.exhibit .ex-tag{display:inline-block;background:var(--pink);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;padding:3px 8px;margin-bottom:7px}
.exhibit .ex-slogan{font-size:15px;font-weight:700;line-height:1.7;color:var(--pink-deep);margin:0 0 6px}
.exhibit .ex-title{font-weight:900;font-size:21px;color:var(--pink-deep);line-height:1.4;text-shadow:2px 2px 0 #ffd3e5;letter-spacing:.01em}
.exhibit .ex-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin:5px 0 11px;line-height:1.7}
.ex-link{display:inline-block;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--pink-deep);text-decoration:none;border-bottom:1.5px solid var(--pink);padding-bottom:2px}
.ex-link:hover{color:var(--pink);border-bottom-style:dashed}
.result-ex{max-width:none;margin:0 0 26px}
.result-ex .ex-slogan{font-size:16px}
.result-ex .ex-title{font-size:23px}
.result-ex .ex-meta{font-size:13px}

/* ---------- jelly bounce on click ---------- */
.jelly{animation:jelly .56s cubic-bezier(.2,.8,.2,1)}
@keyframes jelly{
  0%{transform:scale(1,1)}
  22%{transform:scale(1.13,.87)}
  42%{transform:scale(.9,1.12)}
  62%{transform:scale(1.06,.94)}
  80%{transform:scale(.97,1.03)}
  100%{transform:scale(1,1)}
}

/* ---------- monitor ---------- */
.monitor{background:#fff;border:3px solid var(--pink);box-shadow:10px 10px 0 var(--pink-soft);padding:16px;position:relative}
.monitor::before,.monitor::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--pink)}
.monitor::before{top:-7px;left:-7px;border-right:0;border-bottom:0}
.monitor::after{bottom:-7px;right:-7px;border-left:0;border-top:0}
.m-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;color:var(--pink-deep);border-bottom:2px dotted var(--line);padding-bottom:10px;letter-spacing:.06em}
.m-head .live{color:var(--pink);animation:blink 1.2s steps(2) infinite}
.m-mid{display:grid;grid-template-columns:1fr 108px;gap:12px;margin:14px 0}
.m-wave{border:1.5px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(212,23,103,.09) 13px 14px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(212,23,103,.09) 13px 14px);height:150px;position:relative;overflow:hidden;display:grid;place-items:center}
.m-wave svg{width:100%;height:100%}
.ecg-base{fill:none;stroke:var(--pink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.25}
.ecg{fill:none;stroke:var(--pink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.m-stats{display:flex;flex-direction:column;gap:8px}
.stat{border:1.5px solid var(--line);padding:7px 8px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.04em}
.stat b{display:block;font-size:16px;color:var(--pink);letter-spacing:0;margin-top:3px}
.m-pixels{height:52px;margin-bottom:12px;border:1.5px solid var(--line);display:grid;grid-template-columns:repeat(24,1fr);gap:2px;padding:6px;align-items:center}
.m-pixels i{aspect-ratio:1;background:var(--pink);opacity:.18}
.m-pixels i.on{opacity:1}
.m-bottom{display:grid;grid-template-columns:1fr 82px;gap:12px;align-items:end}
.m-lines{font-family:var(--mono);font-size:9px;line-height:1.55;letter-spacing:.16em;color:var(--pink);word-break:break-all}
.m-lines span{display:block;white-space:nowrap}
.qr{width:82px;height:82px;border:2px solid var(--pink);padding:3px;background:#fff}
.qr svg{width:100%;height:100%;display:block}
.m-foot{margin-top:12px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);display:flex;justify-content:space-between;border-top:2px dotted var(--line);padding-top:9px}

/* ---------- quiz ---------- */
.quiz-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:52px 0 18px}
.quiz-head h2{font-size:26px;margin:0;font-weight:900;letter-spacing:-.02em}
.counter{font-family:var(--mono);font-size:13px;color:var(--pink-deep);letter-spacing:.1em}
.counter em{font-style:normal;color:var(--pink);font-size:22px}
.progress{height:12px;border:2px solid var(--pink);background:#fff;box-shadow:4px 4px 0 var(--pink-soft);overflow:hidden}
.progress div{height:100%;background:repeating-linear-gradient(90deg,var(--pink) 0 12px,var(--pink-mid) 12px 16px);width:10%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.q-card{background:#fff;border:2px solid var(--pink);box-shadow:8px 8px 0 var(--pink-soft);padding:34px 36px;margin-top:26px}
.q-index{font-family:var(--pixel);font-size:11px;color:var(--pink);letter-spacing:.04em}
.q-title{font-size:clamp(19px,2.6vw,25px);font-weight:900;line-height:1.6;margin:14px 0 26px;letter-spacing:-.01em}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--pink-pale);padding:18px 18px 18px 56px;font-family:var(--sans);font-size:14.5px;line-height:1.75;color:var(--ink);min-height:88px;transition:transform .16s,border-color .16s,box-shadow .16s,background .16s}
.opt:hover{transform:translate(-3px,-3px);border-color:var(--pink);box-shadow:5px 5px 0 var(--pink);background:#fff}
.opt .key{position:absolute;left:14px;top:16px;width:28px;height:28px;display:grid;place-items:center;background:var(--pink);color:#fff;font-family:var(--mono);font-size:13px;font-weight:500}
.opt:hover .key{background:var(--pink-deep)}
.opt.picked{border-color:var(--pink);background:#fff;box-shadow:5px 5px 0 var(--pink)}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;min-height:44px}
.back{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--line)}
.back:hover{color:var(--pink)}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}

/* final question */
.final-note{background:var(--pink-soft);border-left:4px solid var(--pink);padding:12px 16px;font-size:13px;line-height:1.8;color:var(--pink-deep);margin:-10px 0 22px}
.mascot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mascot-opt{cursor:pointer;border:2px solid var(--line);background:#fff;padding:10px 8px 12px;text-align:center;transition:transform .16s,box-shadow .16s,border-color .16s}
.mascot-opt:hover{transform:translate(-3px,-3px);border-color:var(--pink);box-shadow:5px 5px 0 var(--pink)}
.mascot-opt img{width:100%;height:96px;object-fit:contain;display:block}
.mascot-opt b{display:block;font-family:var(--mono);font-size:15px;color:var(--pink-deep);margin-top:4px;letter-spacing:.06em}
.mascot-opt small{font-size:11px;color:var(--muted)}

/* ---------- result ---------- */
.result-top{text-align:center;padding:58px 0 8px}
.result-top .eyebrow{margin-bottom:14px}
.result-top h2{font-size:clamp(28px,4.5vw,44px);font-weight:900;margin:0;color:var(--pink-deep);letter-spacing:-.03em}
.result-top p{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted)}
.result-card{display:flex;flex-direction:column;background:#fff;border:3px solid var(--pink);box-shadow:10px 10px 0 var(--pink-soft);margin:34px 0 26px}
.result-avatar{background:var(--pink-pale);border-bottom:2px solid var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;position:relative}
.result-avatar::before{content:"";position:absolute;inset:14px;border:1.5px dashed var(--line);pointer-events:none}
.result-avatar img{width:100%;max-width:270px;height:auto;max-height:270px;object-fit:contain;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px) rotate(-2deg)}}
.result-body{padding:26px 34px 30px}
.traits-line{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--pink);margin-bottom:8px}
.type-name{font-size:clamp(25px,3.4vw,34px);font-weight:900;margin:0 0 18px;letter-spacing:-.02em}
.type-desc{font-size:14.5px;line-height:2;color:#523349;margin:0}
.lyric{margin-bottom:22px;background:var(--pink-pale);border-left:4px solid var(--pink);padding:18px 22px}
.lyric .ly-text{font-size:16px;line-height:1.9;font-weight:700;color:var(--pink-deep);white-space:pre-line}
.lyric .ly-credit{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}
.panel{background:#fff;border:2px solid var(--pink);box-shadow:5px 5px 0 var(--pink-soft);padding:22px}
.panel h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--pink);margin:0 0 4px;font-weight:500}
.panel .panel-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.sliders{display:flex;flex-direction:column;gap:30px;padding:8px 2px 4px}
.slider-row{text-align:center}
.slider-dim{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--pink-deep);margin-bottom:10px}
.slider-bar{position:relative;height:40px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#f5f3f5}
.slider-fill{position:absolute;top:0;bottom:0;border-radius:24px}
.pct-badge{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid rgba(212,23,103,.28);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--pink-deep);box-shadow:0 2px 5px rgba(142,11,69,.12)}
.pct-badge.bl{left:1px}
.pct-badge.br{right:1px}
.side-label{position:absolute;top:50%;transform:translateY(-50%);z-index:2;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap;color:var(--muted);background:rgba(255,255,255,.92);padding:2px 4px;border-radius:4px}
.side-label.ll{left:40px}
.side-label.rl{right:40px;text-align:right}
.side-label.on-fill{color:#fff;background:transparent;padding:0}
@media(max-width:560px){
  .slider-bar{height:38px}
  .pct-badge{width:34px;height:34px;font-size:11px}
  .side-label{font-size:11px}
  .side-label.ll{left:40px}
  .side-label.rl{right:40px}
}
.match-list{display:flex;flex-direction:column;gap:22px}
.match{display:flex;gap:22px;align-items:flex-start;border-bottom:1px dashed var(--line);padding-bottom:22px}
.match:last-child{border-bottom:0;padding-bottom:0}
.match img{width:150px;height:150px;object-fit:contain;flex:none;background:var(--pink-pale);border:1.5px solid var(--line)}
.match .m-code{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--pink-deep)}
.match .m-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:4px 8px;margin-left:8px;vertical-align:middle}
.match .m-tag.good{background:#ffe6f0;color:var(--pink)}
.match .m-tag.bad{background:#3d1730;color:#ffd0e3}
.match .m-name{font-size:22px;font-weight:900;margin:8px 0 8px}
.match .m-why{font-size:15px;line-height:1.9;color:var(--muted)}
.actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:34px 0 70px}

/* ---------- footer / toast ---------- */
.footer{border-top:2px solid var(--line);padding:24px 0 36px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);line-height:2}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;padding:12px 22px;opacity:0;pointer-events:none;transition:.3s;z-index:120;box-shadow:4px 4px 0 var(--pink)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:18px}
.loading .ld-heart{font-size:56px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.loading p{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--pink)}

@media(max-width:860px){
  .hero-head{padding:44px 0 24px}
  .hero{grid-template-columns:1fr;gap:32px;padding:0 0 60px}
  .monitor{max-width:460px}
  .result-card{grid-template-columns:1fr}
  .result-avatar{border-right:0;border-bottom:2px solid var(--pink);min-height:280px}
  .analysis-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding:0 18px}
  .topbar-in{padding:10px 18px}
  .barcode{width:56px}
  .options{grid-template-columns:1fr}
  .mascot-grid{grid-template-columns:repeat(2,1fr)}
  .q-card{padding:24px 20px}
  .result-body{padding:24px 20px}
  .title{text-shadow:4px 4px 0 #ffd3e5}
  .match img{width:110px;height:110px}
  .match .m-name{font-size:19px}
  .match .m-why{font-size:13.5px}
}
</style>
</head>
<body>
<div class="scanlines"></div>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="dot"></span>LOVE-TI SYSTEM <span style="color:var(--muted)">/ ONLINE</span></div>
    <div class="top-right">
      <div class="lang-switch" id="langSwitch" role="group" aria-label="language"></div>
      <div class="barcode" aria-hidden="true"></div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ============ HERO ============ -->
  <section id="hero" class="screen active">
    <div class="hero-head">
      <span class="eyebrow" data-text="eyebrow"></span>
      <h1 class="title">LOVE<span>-ti</span></h1>
      <div class="subtitle" data-html="subtitle"></div>
    </div>
    <div class="hero">
      <div>
        <div class="intro" data-html="introHTML"></div>
        <div class="exhibit">
          <span class="ex-tag">EXHIBITION</span>
          <div class="ex-slogan" data-text="exhibitionSlogan"></div>
          <div class="ex-title" data-text="exhibitionTitle"></div>
          <div class="ex-meta" data-text="exhibitionShare"></div>
          <a class="ex-link" data-exhibition-link target="_blank" rel="noopener" data-text="exhibitionBtn"></a>
        </div>
        <div class="hero-actions">
          <button class="btn" onclick="startQuiz()" data-html="startBtn"></button>
          <div class="note" data-text="disclaimer"></div>
        </div>
      </div>

      <div class="monitor">
        <div class="m-head"><span>LOVE MONITOR · v1.0</span><span class="live">● LIVE</span></div>
        <div class="m-mid">
          <div class="m-wave">
            <svg viewBox="0 0 300 150" preserveAspectRatio="none">
              <path class="ecg-base" d="M0 78 H38 l9 0 l7 -16 l9 47 l8 -31 l8 0 H96 l8 0 l7 -16 l9 47 l8 -31 l8 0 H158 l9 0 l7 -16 l9 47 l8 -31 l8 0 H222 l8 0 l7 -16 l9 47 l8 -31 l8 0 H300"/>

<script>
/* =========================================================
   DATA  —— 所有可修改文字集中在 content.js
   ========================================================= */
const IMAGE = code => `assets/mascots/${code}.png`;
const C = window.LOVE_TI_CONTENT;
let LANG = localStorage.getItem('loveti-lang') || C.defaultLang;
if(!C.langs[LANG]) LANG = C.defaultLang;
let DATA = C.langs[LANG];
let QUESTIONS = DATA.questions;
let BONUS = DATA.bonus;
let TYPES = DATA.types;
let UI = DATA.ui;
let TRAIT = DATA.TRAIT;
const DIMS = [['D','L'],['P','C'],['R','S']];
let currentCode = 'DPR';

// 把 content.js 的文字填入頁面
function fillTexts(root){
  const scope = root || document;
  scope.querySelectorAll('[data-text]').forEach(el=>{ el.textContent = UI[el.dataset.text] ?? ''; });
  scope.querySelectorAll('[data-html]').forEach(el=>{ el.innerHTML = UI[el.dataset.html] ?? ''; });
  scope.querySelectorAll('[data-exhibition-link]').forEach(el=>{ el.href = UI.exhibitionUrl; });
}
fillTexts();

/* ---------- 語言切換 ---------- */
function buildLangSwitch(){
  const box=document.getElementById('langSwitch');
  box.innerHTML = C.order.map(code=>`<button type="button" class="lang-btn${code===LANG?' active':''}" data-lang="${code}">${C.langs[code].short}</button>`).join('');
  box.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>setLanguage(btn.dataset.lang)));
}
function setLanguage(code){
  if(!C.langs[code] || code===LANG) return;
  LANG = code; DATA = C.langs[code];
  QUESTIONS = DATA.questions; BONUS = DATA.bonus; TYPES = DATA.types; UI = DATA.ui; TRAIT = DATA.TRAIT;
  localStorage.setItem('loveti-lang', LANG);
  document.documentElement.lang = LANG==='zh-Hans' ? 'zh-CN' : (LANG==='en' ? 'en' : 'zh-Hant');
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===LANG));
  fillTexts();
  const active = document.querySelector('.screen.active');
  if(active && active.id==='quiz'){ phase==='bonus' ? renderBonus() : renderQuestion(); }
  if(active && active.id==='result') renderResult(currentCode);
  if(active && active.id==='loadingScreen') document.getElementById('loadingText').textContent = UI.loadingText;
  if(UI.toastLang) toast(UI.toastLang);
}
document.documentElement.lang = LANG==='zh-Hans' ? 'zh-CN' : (LANG==='en' ? 'en' : 'zh-Hant');
buildLangSwitch();

// 果凍彈跳：點擊選項或人格圖時彈一下
function jelly(el){
  if(!el) return;
  el.classList.remove('jelly'); void el.offsetWidth; el.classList.add('jelly');
  setTimeout(()=>el.classList.remove('jelly'), 600);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('.result-avatar img, .match img');
  if(el) jelly(el);
});

/* =========================================================
   STATE
   ========================================================= */
let answers = [];        // 12 題主問題的答案
let current = 0;
let scores = {};
let bonusQueue = [];     // 需要進行額外問題的維度索引
let bonusAnswers = [];
let bonusPos = 0;
let phase = 'main';

function freshScores(){ return {D:0,L:0,P:0,C:0,R:0,S:0,F:0}; }

function tally(){
  scores = freshScores();
  answers.forEach((choice,i)=>{
    (QUESTIONS[i]?.options[choice]?.s || []).forEach(k => scores[k]++);
  });
  bonusAnswers.forEach(({bi,ci})=>{
    (BONUS[bi]?.options[ci]?.s || []).forEach(k => scores[k]++);
  });
}

// 只計算主問題，用來判斷哪些維度同分
function mainScores(){
  const s = freshScores();
  answers.forEach((choice,i)=>{
    (QUESTIONS[i]?.options[choice]?.s || []).forEach(k => s[k]++);
  });
  return s;
}

/* =========================================================
   SCREENS
   ========================================================= */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
}
function startQuiz(){
  answers=[]; current=0; bonusQueue=[]; bonusAnswers=[]; bonusPos=0; phase='main';
  tally(); renderQuestion(); show('quiz');
}

function setProgress(n, label){
  document.getElementById('counterWrap').innerHTML = label;
  document.getElementById('progressBar').style.width = n+'%';
  document.getElementById('backBtn').style.visibility = (phase==='bonus' || current>0) ? 'visible':'hidden';
}

function renderQuestion(){
  setProgress((current+1)/QUESTIONS.length*100, `Q <em>${String(current+1).padStart(2,'0')}</em> / ${String(QUESTIONS.length).padStart(2,'0')}`);
  const item = QUESTIONS[current];
  document.getElementById('qCard').innerHTML = `
    <div class="q-index">QUESTION ${String(current+1).padStart(2,'0')}</div>
    <div class="q-title">${item.q}</div>
    <div class="options">
      ${item.options.map((o,i)=>`<button class="opt" onclick="choose(${i})"><span class="key">${'ABCD'[i]}</span>${o.t}</button>`).join('')}
    </div>`;
}

function renderBonus(){
  const bi = bonusQueue[bonusPos];
  const item = BONUS[bi];
  setProgress(100, `EX <em>${String(bonusPos+1).padStart(2,'0')}</em> / ${String(bonusQueue.length).padStart(2,'0')}`);
  document.getElementById('qCard').innerHTML = `
    <div class="q-index">${UI.extraLabel}</div>
    <div class="q-title">${item.q}</div>
    <div class="options">
      ${item.options.map((o,i)=>`<button class="opt" onclick="chooseBonus(${i})"><span class="key">${'AB'[i]}</span>${o.t}</button>`).join('')}
    </div>`;
}

function choose(i){
  answers[current] = i;
  tally();
  if(current < QUESTIONS.length-1){ current++; renderQuestion(); }
  else afterMain();
}

function afterMain(){
  const s = mainScores();
  bonusQueue = DIMS.map((pair,idx)=> s[pair[0]]===s[pair[1]] ? idx : null).filter(v=>v!==null);
  bonusAnswers=[]; bonusPos=0;
  if(bonusQueue.length===0) finish();
  else { phase='bonus'; renderBonus(); }
}

function chooseBonus(i){
  bonusAnswers.length = bonusPos;
  bonusAnswers.push({bi:bonusQueue[bonusPos], ci:i});
  bonusPos++;
  tally();
  if(bonusPos < bonusQueue.length) renderBonus();
  else finish();
}

function goBack(){
  if(phase==='bonus'){
    if(bonusPos>0){ bonusPos--; bonusAnswers.length=bonusPos; renderBonus(); }
    else { phase='main'; current=QUESTIONS.length-1; renderQuestion(); }
  } else if(current>0){
    current--; answers.length=current; tally(); renderQuestion();
  }
}

function finish(){
  phase='done';
  show('loadingScreen');
  let p=5; const bar=document.getElementById('loadBar');
  const timer=setInterval(()=>{
    p += 12+Math.random()*16;
    bar.style.width = Math.min(100,p)+'%';
    if(p>=100){
      clearInterval(timer);
      setTimeout(()=>renderResult(computeResult()), 420);
    }
  },230);
}

/* =========================================================
   RESULT
   ========================================================= */
function computeResult(){
  tally();
  // 彩蛋：四個「分手選項」全部選中才解鎖
  if(scores.F >= 4) return 'DPR-F';
  let code = '';
  DIMS.forEach(pair=>{
    code += scores[pair[0]] >= scores[pair[1]] ? pair[0] : pair[1];
  });
  return code;
}

function slidersHTML(){
  const colors = ['#d41767','#e94d8c','#8e0b45'];
  return UI.profileDims.map((d,idx)=>{
    const a = scores[d.left], b = scores[d.right], total = a+b;
    const win = a>=b ? d.left : d.right;
    const pct = total===0 ? 50 : Math.round(Math.max(a,b)/total*100);
    const leftDominant = win===d.left;
    const leftPct = leftDominant ? pct : 100-pct;
    const rightPct = 100-leftPct;
    const leftOnFill = (leftDominant && pct>=15) || (!leftDominant && pct>=95);
    const rightOnFill = (!leftDominant && pct>=15) || (leftDominant && pct>=95);
    const fillStyle = leftDominant
      ? `left:0;width:${pct}%;background:${colors[idx]}`
      : `right:0;width:${pct}%;background:${colors[idx]}`;
    return `<div class="slider-row">
      <div class="slider-dim">${d.name}</div>
      <div class="slider-bar">
        <div class="slider-fill" style="${fillStyle}"></div>
        <span class="pct-badge bl">${leftPct}%</span>
        <span class="side-label ll ${leftOnFill?'on-fill':''}">${TRAIT[d.left]}</span>
        <span class="side-label rl ${rightOnFill?'on-fill':''}">${TRAIT[d.right]}</span>
        <span class="pct-badge br">${rightPct}%</span>
      </div>
    </div>`;
  }).join('');
}

function renderResult(code){
  currentCode = code;
  const t = TYPES[code];
  const spark = TYPES[t.spark], clash = TYPES[t.clash];
  const traits = [TRAIT[code[1]], TRAIT[code[0]], TRAIT[code[2]]].join(' · ');
  document.getElementById('resultContent').innerHTML = `
    <div class="result-top">
      <span class="eyebrow">${UI.resultEyebrow}</span>
      <h2>${UI.resultTitle}</h2>
      <p>${UI.resultSub}</p>
    </div>

    <div class="result-card">
      <div class="result-avatar">
        <img src="${IMAGE(code)}" alt="${t.name}">
      </div>
      <div class="result-body">
        <div class="traits-line">（${traits}）</div>
        <div class="type-name">${t.name}</div>
        <div class="lyric">
          <div class="ly-text">${t.lyric}</div>
          <div class="ly-credit">〈${t.song}〉唱：${t.singer}　曲：${t.composer||''}　詞：${t.lyricist}</div>
        </div>
        <p class="type-desc">${t.desc}</p>
      </div>
    </div>

    <div class="analysis-grid">
      <div class="panel">
        <h3>${UI.profileTitle}</h3>
        <div class="panel-sub">${UI.profileSub}</div>

      </div>
      <div class="panel">
        <h3>${UI.compatTitle}</h3>
        <div class="panel-sub">${UI.compatSub}</div>
        <div class="match-list">
          <div class="match">
            <img src="${IMAGE(t.spark)}" alt="${spark.name}">
            <div>
              <div class="m-code"><span class="m-tag good">${UI.tagSpark}</span></div>
              <div class="m-name">${spark.name}</div><div class="m-why">${t.sparkWhy}</div>
            </div>
          </div>
          <div class="match">
            <img src="${IMAGE(t.clash)}" alt="${clash.name}">
            <div>
              <div class="m-code"><span class="m-tag bad">${UI.tagClash}</span></div>
              <div class="m-name">${clash.name}</div><div class="m-why">${t.clashWhy}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="exhibit result-ex">
      <span class="ex-tag">EXHIBITION</span>
      <div class="ex-slogan" data-text="exhibitionSlogan"></div>
      <div class="ex-title" data-text="exhibitionTitle"></div>
      <div class="ex-meta" data-text="exhibitionShare"></div>
      <a class="ex-link" data-exhibition-link target="_blank" rel="noopener" data-text="exhibitionBtn"></a>
    </div>

    <div class="actions">
      <button class="btn" onclick="shareImage()" data-html="shareImageBtn"></button>
      <button class="btn ghost small" onclick="startQuiz()" data-html="retryBtn"></button>
      <button class="btn ghost small" onclick="show('hero')" data-html="homeBtn"></button>
    </div>`;
  fillTexts(document.getElementById('resultContent'));
  show('result');
}

/* =========================================================
   EXTRAS
   ========================================================= */
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2400);
}
function shareCaption(code){
  const t=TYPES[code];
  return UI.shareCaption
    .replace('{name}',t.name)
    .replace('{lyric}',t.lyric.replace(/\n/g,' / '))
    .replace('{song}',t.song)
    .replace('{singer}',t.singer)
    .replace('{composer}',t.composer||'')
    .replace('{lyricist}',t.lyricist)
    .replace('{slogan}',UI.exhibitionSlogan)
    .replace('{exhibitionTitle}',UI.exhibitionTitle)
    .replace('{exhibitionDate}',UI.exhibitionDate)
    .replace('{exhibitionVenue}',UI.exhibitionVenue)
    .replace('{exhibitionLink}',UI.exhibitionLink)
    .replace('{url}',location.href);
}
function copyText(text){
  if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  return new Promise((res,rej)=>{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); } finally{ ta.remove(); }
  });
}
function shareResult(){
  copyText(shareCaption(currentCode)).then(()=>toast(UI.toastCopy)).catch(()=>toast('複製失敗，請手動選取文字'));
}
function shareWhatsApp(){
  window.open('https://wa.me/?text='+encodeURIComponent(shareCaption(currentCode)),'_blank','noopener');
  toast(UI.toastWhatsApp);
}
function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
async function buildShareCanvas(code){
  const t=TYPES[code];
  const canvas=document.createElement('canvas');
  canvas.width=1080; canvas.height=1350;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fffafd'; ctx.fillRect(0,0,1080,1350);
  ctx.strokeStyle='rgba(212,23,103,.06)'; ctx.lineWidth=1;
  for(let x=0;x<1080;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1350);ctx.stroke();}
  for(let y=0;y<1350;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1080,y);ctx.stroke();}
  ctx.strokeStyle='#d41767'; ctx.lineWidth=6; ctx.strokeRect(30,30,1020,1290);
  ctx.fillStyle='#8e0b45'; ctx.font='900 54px "Noto Sans TC",sans-serif'; ctx.fillText('LOVE-ti',72,118);
  ctx.fillStyle='#d41767'; ctx.font='500 22px "DM Mono",monospace'; ctx.fillText(UI.canvasTitle||'LOVE PERSONALITY TEST',74,154);
  let img=null; try{ img=await loadImage(IMAGE(code)); }catch(e){}
  if(img){
    const scale=Math.min(540/img.width,470/img.height);
    const w=img.width*scale, h=img.height*scale;
    ctx.drawImage(img,540-w/2,175+(470-h)/2,w,h);
  }
  ctx.textAlign='center';
  const traits=[TRAIT[code[1]],TRAIT[code[0]],TRAIT[code[2]]].join(' · ');
  ctx.fillStyle='#d41767'; ctx.font='500 26px "DM Mono",monospace'; ctx.fillText('（'+traits+'）',540,675);
  ctx.fillStyle='#311423'; ctx.font='900 66px "Noto Sans TC",sans-serif'; ctx.fillText(t.name,540,755);
  ctx.fillStyle='#ffe4ef'; ctx.fillRect(100,800,880,205);
  ctx.fillStyle='#d41767'; ctx.fillRect(100,800,8,205);
  ctx.fillStyle='#8e0b45'; ctx.font='700 36px "Noto Sans TC",sans-serif';
  t.lyric.split('\n').forEach((ln,i)=>ctx.fillText(ln,540,862+i*52));
  ctx.fillStyle='#8c6a7b'; ctx.font='22px "DM Mono",monospace';
  ctx.fillText('〈'+t.song+'〉唱：'+t.singer+'　曲：'+(t.composer||'')+'　詞：'+t.lyricist,540,985);
  ctx.fillStyle='#d41767'; ctx.font='500 24px "DM Mono",monospace';
  ctx.fillText(UI.canvasTestHint||'測測你的戀愛人格 →',540,1075);
  ctx.font='500 21px "DM Mono",monospace';
  ctx.fillText(location.href.length>58?location.href.slice(0,55)+'...':location.href,540,1112);
  // 展覽宣傳（長標語自動縮字，避免溢出）
  const fitFont=(text,maxW,start,min,style,family)=>{
    let size=start;
    ctx.font=`${style} ${size}px ${family}`;
    while(ctx.measureText(text).width>maxW && size>min){ size--; ctx.font=`${style} ${size}px ${family}`; }
    return size;
  };
  ctx.fillStyle='#fff'; ctx.fillRect(90,1138,900,132);
  ctx.strokeStyle='#d41767'; ctx.lineWidth=3; ctx.strokeRect(90,1138,900,132);
  fitFont(UI.exhibitionSlogan,850,23,15,'700','"Noto Sans TC",sans-serif');
  ctx.fillStyle='#8e0b45'; ctx.fillText(UI.exhibitionSlogan,540,1170);
  ctx.save();
  ctx.shadowColor='#ffd3e5'; ctx.shadowOffsetX=3; ctx.shadowOffsetY=3;
  fitFont(UI.exhibitionTitle,850,29,18,'900','"Noto Sans TC",sans-serif');
  ctx.fillStyle='#8e0b45'; ctx.fillText(UI.exhibitionTitle,540,1207);
  ctx.restore();
  fitFont(UI.exhibitionDate+'　'+UI.exhibitionVenue,850,19,13,'','"DM Mono",monospace');
  ctx.fillStyle='#8c6a7b'; ctx.fillText(UI.exhibitionDate+'　'+UI.exhibitionVenue,540,1242);
  ctx.fillStyle='#d41767'; ctx.font='500 19px "DM Mono",monospace';
  ctx.fillText(UI.canvasIgHint||'追蹤展覽 IG ↗',540,1292);
  ctx.fillStyle='#8c6a7b'; ctx.font='16px "DM Mono",monospace';
  ctx.fillText(UI.canvasDisclaimer||'LOVE-TI · 僅供娛樂參考',540,1312);
  ctx.textAlign='left';
  return canvas;
}
function canvasBlob(canvas){ return new Promise(res=>canvas.toBlob(res,'image/png')); }
async function downloadImage(){
  try{
    const canvas=await buildShareCanvas(currentCode);
    const a=document.createElement('a');
    a.download='LOVE-ti_'+TYPES[currentCode].name+'.png';
    a.href=canvas.toDataURL('image/png'); a.click();
    toast(UI.toastDownload);
  }catch(e){ toast('圖片生成失敗，請改用複製文字分享'); }
}
async function shareImage(){
  try{
    const canvas=await buildShareCanvas(currentCode);
    const blob=await canvasBlob(canvas);
    if(!blob) throw new Error('blob failed');
    const file=new File([blob],'LOVE-ti.png',{type:'image/png'});
    const data={title:'LOVE-ti 戀愛人格測試',text:shareCaption(currentCode),files:[file]};
    if(navigator.share && navigator.canShare && navigator.canShare(data)){
      try{ await navigator.share(data); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.download='LOVE-ti.png'; a.href=canvas.toDataURL('image/png'); a.click();
    await copyText(shareCaption(currentCode));
    toast(UI.toastFallback);
  }catch(e){
    toast('此瀏覽器不支援圖片分享，已改為複製文字');
    await copyText(shareCaption(currentCode)).catch(()=>{});
  }
}

// 裝飾：像素愛心
(function(){
  const pattern=['..##...##..','.####.####.','###########','###########','###########','.#########.','..#######..','...#####...','....###....','.....#.....'];
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 11 10'); svg.setAttribute('width','120'); svg.setAttribute('height','110');
  pattern.forEach((row,y)=>[...row].forEach((c,x)=>{ if(c==='#'){ const r=document.createElementNS('http://www.w3.org/2000/svg','rect'); r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',1);r.setAttribute('height',1);r.setAttribute('fill','#d41767');svg.appendChild(r);} }));
  document.getElementById('pixelHeart').appendChild(svg);

  const row=document.getElementById('pixelRow');

  const qr=document.getElementById('fakeQr');
  const size=15, cells=[];
  for(let y=0;y<size;y++){ cells[y]=[]; for(let x=0;x<size;x++) cells[y][x]=Math.random()>.5; }
  const finder=(ox,oy)=>{ for(let y=0;y<7;y++)for(let x=0;x<7;x++){ const edge=x===0||x===6||y===0||y===6, core=x>=2&&x<=4&&y>=2&&y<=4; cells[oy+y][ox+x]=edge||core; } };
  finder(0,0); finder(8,0); finder(0,8);
  let html=`<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">`;
  cells.forEach((r,y)=>r.forEach((on,x)=>{ if(on) html+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#d41767"/>`; }));
  qr.innerHTML=html+'</svg>';

  const ecg=document.querySelector('.ecg');
  if(ecg && ecg.getTotalLength && ecg.animate){
    const len=Math.ceil(ecg.getTotalLength()), seg=130;
    ecg.style.strokeDasharray=`${seg} ${len+seg+20}`;
    ecg.animate([{strokeDashoffset:seg},{strokeDashoffset:-(len+seg)}],{duration:3200,iterations:Infinity,easing:'linear'});
  }
  setInterval(()=>{ document.getElementById('bpm').textContent=(80+Math.floor(Math.random()*16))+' BPM'; },2200);
})();
</script>
</body>
</html>
